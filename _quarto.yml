# Quarto website configuration.  Build with:
#     quarto preview        # dev server with live reload
#     quarto render         # static build -> _build/html/

project:
  type: website
  output-dir: docs/
  render:
    - index.qmd
    - chap0_preface.qmd
    - chap1.qmd
    - chap2.qmd
    - chap3.qmd
    - chap4.qmd
    - chap5.qmd
    - chap6.qmd
    - chap7.qmd
    - chap8.qmd
    - chap10_appendix.qmd
    - chap_naming.qmd
    - chap_todo.qmd
    - gallery.qmd
    - gallery/cuckoo.qmd
    - gallery/sunspot.qmd
    - gallery/cmb.qmd
    - gallery/seismometer.qmd
    - gallery/gravitational_waves.qmd
    - gallery/exoplanet.qmd
    - gallery/gearbox.qmd
    - gallery/coherence.qmd
    - gallery/windowing.qmd
    - gallery/dwt_image.qmd
    - gallery/aliasing.qmd
    - gallery/stft_cwt.qmd
    - gallery/piano.qmd
    - gallery/missing_fundamental.qmd
    - gallery/kalman_gps_imu.qmd
    - gallery/airy_diffraction.qmd
    - gallery/chorus_svd.qmd
    - gallery/spectral_pde.qmd
  resources:
    - .nojekyll
    # Figures and data live at project root; Quarto copies them into docs/
    - Figure/
    - Data/indian_cuckoo_short.wav
    - Data/gearbox_spectraquest.npz
    - Data/kalman_gps_imu.npz
    - Data/two_point_correlation_schematic.webm
    - Data/missing_fundamental_full.wav
    - Data/missing_fundamental_no_f1.wav
    - Data/missing_fundamental_octave.wav
    - styles.css
    # figure_code_map.js is lazy-loaded on first figure click (figure_modal.js is inlined).
    - js/figure_code_map.js

website:
  title: "Practical Spectral Analysis"
  description: "A practical guide to spectral analysis with Python."
  repo-url: https://github.com/jiutongzhao/Time-Series-Data-Analysis
  navbar:
    title: "Practical Spectral Analysis"
    logo: Figure/figure_icon.png
    search: true
    background: light
  sidebar:
    style: floating
    collapse-level: 2
    contents:
      - text: "Preface"
        file: chap0_preface.qmd
      - text: "Gallery"
        file: gallery.qmd
      - text: "1. Data Initialization"
        file: chap1.qmd
      - text: "2. Frequency Domain"
        file: chap2.qmd
      - text: "3. Power Spectral Density"
        file: chap3.qmd
      - text: "4. More about FFT"
        file: chap4.qmd
      - text: "5. Noise"
        file: chap5.qmd
      - text: "6. Signal Processing"
        file: chap6.qmd
      - text: "7. Time-Frequency Analysis"
        file: chap7.qmd
      - text: "8. Multi-Channel Signals"
        file: chap8.qmd
      - text: "Reference"
      - text: "Appendix"
        file: chap10_appendix.qmd
      - text: "Naming Convention"
        file: chap_naming.qmd
      - text: "Changelog"
        file: chap_todo.qmd
  page-footer:
    center: "© 2024–2026 Jiutong Zhao · Content CC BY 4.0 · Code MIT"

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    grid:
      sidebar-width: 300px
      body-width: 900px
      margin-width: 280px
      gutter-width: 1.5rem
    include-in-header:
      - file: _includes/fonts.html
      - file: _includes/navbar-python.html
    include-after-body:
      file: _includes/mermaid-init.html
    toc: true
    toc-depth: 3
    toc-location: right
    code-copy: true
    code-overflow: wrap
    highlight-style: github
    smooth-scroll: true
    fig-cap-location: bottom
    tbl-cap-location: top

html-math-method: katex

execute:
  freeze: auto
  echo: true
  warning: false

# MyST-MD / Jupyter Book v2 configuration.
# Docs: https://mystmd.org/guide
#
# Build commands:
#     myst start          # dev server with live reload   (best for editing)
#     myst build --html   # static site -> _build/html/
#     jupyter book build  # alias of `myst build` in recent versions
version: 1

project:
  title: Practical Spectral Analysis with Python
  description: >
    A practical guide to spectral analysis with Python — Fourier transforms,
    power spectral density, wavelets, multi-channel methods, plus worked
    examples drawn from plasma physics, audio, geophysics and astronomy.
  authors:
    - name: Jiutong Zhao
      email: jiutongzhao@gmail.com
      orcid: ""                # add when you have one
      github: jiutongzhao
  github: https://github.com/jiutongzhao/Time-Series-Data-Analysis
  license:
    content: CC-BY-4.0
    code: MIT
  open_access: true
  date: 2026-05-09

  # Custom LaTeX macros — usable directly inside any chapter as e.g. \FT,
  # \expect{X}, \abs{x}.  This is the v2 equivalent of the
  # mathjax3_config.tex.macros block in the old _config.yml.
  math:
    "\\FT": "\\mathcal{F}"
    "\\iFT": "\\mathcal{F}^{-1}"
    "\\expect": ["\\mathbb{E}\\left[#1\\right]", 1]
    "\\abs": ["\\left|#1\\right|", 1]
    "\\norm": ["\\left\\|#1\\right\\|", 1]

  # Don't auto-execute notebooks at build time — chap*.ipynb already
  # ships with cached outputs from the user's local Anaconda env.
  jupyter:
    execute_notebooks: cache       # use stored outputs; only run cells with no output
    timeout: 120

  # Table of contents.  Two-level: each prose chapter (docs/chapN.md) is
  # the primary entry; the corresponding chapN.ipynb hangs underneath.
  toc:
    - file: intro.md
    - title: Front Matter
      children:
        - file: docs/chap0_preface.md
    - title: The Spectral-Analysis Handbook
      children:
        - file: docs/chap1.md
          children:
            - file: chap1.ipynb
        - file: docs/chap2.md
          children:
            - file: chap2.ipynb
        - file: docs/chap3.md
          children:
            - file: chap3.ipynb
        - file: docs/chap4.md
          children:
            - file: chap4.ipynb
        - file: docs/chap5.md
          children:
            - file: chap5.ipynb
        - file: docs/chap6.md
          children:
            - file: chap6.ipynb
        - file: docs/chap7.md
          children:
            - file: chap7.ipynb
        - file: docs/chap8.md
          children:
            - file: chap8.ipynb
    - title: Back Matter
      children:
        - file: docs/chap9.md
        - file: docs/chap10_appendix.md
        - file: docs/_todo.md

site:
  # Built-in v2 theme: clean academic-style book layout.
  template: book-theme
  options:
    # Folded TOC by default — chapters expand on click.
    folders: true
    # Use a hierarchical numbering scheme on chapter titles.
    numbering:
      enabled: true
      headings: false
  # Top-bar links.  `actions:` puts buttons on the right of the navbar.
  actions:
    - title: GitHub
      url: https://github.com/jiutongzhao/Time-Series-Data-Analysis
  # Hide the "Built with MyST" footer and replace with project copyright.
  footer:
    copyright: "© 2024–2026 Jiutong Zhao. CC BY 4.0."

# Render the Quarto site on every push to main and publish it to
# `gh-pages` so GitHub Pages can serve _build/html/.
#
# Repo Settings -> Actions -> General -> Workflow permissions:
#   must be "Read and write permissions" for the gh-pages push to succeed.
#
# Repo Settings -> Pages -> Source:
#   "Deploy from a branch" -> gh-pages / (root)

name: Build Quarto site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed for peaceiris/actions-gh-pages to push gh-pages

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.9.37"   # match local version

      # No Python install needed: all .qmd files use static code blocks only.
      # Figures are pre-generated PNGs committed to docs/Figure/.

      - name: Render Quarto
        run: quarto render

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs
          publish_branch: gh-pages
          force_orphan: true

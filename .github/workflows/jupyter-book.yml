# Build the MyST-MD / Jupyter Book v2 site on every push to main and
# publish it to gh-pages.
#
# Repo Settings -> Pages should be set to "Deploy from branch:
# gh-pages / (root)".

name: Build MyST book

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install MyST-MD
        run: npm install -g mystmd

      - name: Build the book
        run: myst build --html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _build/html
          publish_branch: gh-pages
          force_orphan: true

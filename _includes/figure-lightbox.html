<!-- Click-to-zoom lightbox for all content images.
     Wheel / pinch / double-click to zoom, drag to pan, Esc to close.
     For figure_*.png a "view code" button lazy-loads js/figure_code_map.js
     (~200 KB, only on first use) and shows the generating notebook cell. -->
<script>
(function () {
  "use strict";

  // Infer the site root from a Quarto-injected site_libs script, so the
  // code-map URL works at any page depth (root or gallery/ subdir).
  var SITE_ROOT = (function () {
    for (var i = 0; i < document.scripts.length; i++) {
      var src = document.scripts[i].src || "";
      var k = src.indexOf("site_libs");
      if (k !== -1) return src.substring(0, k);
    }
    return "";
  })();

  /* ---------- lazy code map ---------- */
  var mapState = 0, mapCbs = [];               // 0 idle · 1 loading · 2 done
  function loadMap(cb) {
    if (mapState === 2) { cb(); return; }
    mapCbs.push(cb);
    if (mapState === 1) return;
    mapState = 1;
    var s = document.createElement("script");
    s.src = SITE_ROOT + "js/figure_code_map.js";
    s.onload = s.onerror = function () {
      mapState = 2;
      mapCbs.forEach(function (f) { f(); });
      mapCbs = [];
    };
    document.head.appendChild(s);
  }

  function basename(src) {
    return (src || "").split("?")[0].split("#")[0].split("/").pop();
  }

  /* ---------- overlay ---------- */
  var overlay, stage, pic, caption, codeBtn, copyBtn, codePanel, codeSrc, codeBody;
  var scale = 1, tx = 0, ty = 0, fitW = 0, fitH = 0;
  var pointers = new Map(), pinchDist = 0;
  // pointer capture retargets the post-drag click to the stage; this flag
  // stops that synthetic click from being mistaken for a backdrop click
  var suppressClose = false;

  function build() {
    if (overlay) return;
    overlay = document.createElement("div");
    overlay.className = "lb-overlay hidden";
    overlay.innerHTML =
      '<div class="lb-toolbar">' +
      '<span class="lb-caption"></span>' +
      '<span class="lb-hint">scroll / double-click to zoom · drag to pan · Esc to close</span>' +
      '<button type="button" class="lb-btn lb-code-btn">&lt;/&gt; view code</button>' +
      '<button type="button" class="lb-btn lb-copy" style="display:none">Copy</button>' +
      '<button type="button" class="lb-btn lb-close" title="Close (Esc)">✕</button>' +
      '</div>' +
      '<div class="lb-stage">' +
      '<img alt="">' +
      '<div class="lb-code hidden"><div class="lb-code-src"></div><pre><code></code></pre></div>' +
      '</div>';
    document.body.appendChild(overlay);
    stage     = overlay.querySelector(".lb-stage");
    pic       = stage.querySelector("img");
    caption   = overlay.querySelector(".lb-caption");
    codeBtn   = overlay.querySelector(".lb-code-btn");
    copyBtn   = overlay.querySelector(".lb-copy");
    codePanel = overlay.querySelector(".lb-code");
    codeSrc   = overlay.querySelector(".lb-code-src");
    codeBody  = overlay.querySelector(".lb-code code");

    overlay.querySelector(".lb-close").addEventListener("click", close);
    stage.addEventListener("click", function (e) {
      if (suppressClose) { suppressClose = false; return; }
      if (e.target === stage) close();               // click beside the image
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && !overlay.classList.contains("hidden")) close();
    });

    stage.addEventListener("wheel", onWheel, { passive: false });
    pic.addEventListener("dblclick", onDblClick);
    stage.addEventListener("pointerdown", onDown);
    stage.addEventListener("pointermove", onMove);
    stage.addEventListener("pointerup", onUp);
    stage.addEventListener("pointercancel", onUp);
    codeBtn.addEventListener("click", toggleCode);
    copyBtn.addEventListener("click", function () {
      if (!navigator.clipboard) return;
      navigator.clipboard.writeText(codeBody.textContent).then(function () {
        copyBtn.textContent = "Copied!";
        setTimeout(function () { copyBtn.textContent = "Copy"; }, 1200);
      });
    });
    window.addEventListener("resize", function () {
      if (!overlay.classList.contains("hidden") && scale === 1) fit();
    });
  }

  function apply() {
    pic.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + scale + ")";
  }

  function fit() {
    var SW = stage.clientWidth, SH = stage.clientHeight;
    var nW = pic.naturalWidth || 1, nH = pic.naturalHeight || 1;
    var f = Math.min((SW - 32) / nW, (SH - 32) / nH, 1);
    fitW = nW * f; fitH = nH * f;
    pic.style.width  = fitW + "px";
    pic.style.height = fitH + "px";
    scale = 1;
    tx = (SW - fitW) / 2;
    ty = (SH - fitH) / 2;
    apply();
  }

  function clampPan() {
    var SW = stage.clientWidth, SH = stage.clientHeight;
    var w = fitW * scale, h = fitH * scale;
    if (w <= SW) tx = (SW - w) / 2;
    else tx = Math.min(0, Math.max(SW - w, tx));
    if (h <= SH) ty = (SH - h) / 2;
    else ty = Math.min(0, Math.max(SH - h, ty));
  }

  function zoomAt(cx, cy, factor) {
    var s2 = Math.min(12, Math.max(1, scale * factor));
    if (s2 === scale) return;
    tx = cx - (cx - tx) * (s2 / scale);
    ty = cy - (cy - ty) * (s2 / scale);
    scale = s2;
    clampPan();
    apply();
    pic.style.cursor = scale > 1 ? "grab" : "zoom-in";
  }

  function stagePoint(e) {
    var r = stage.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  }

  function onWheel(e) {
    if (!codePanel.classList.contains("hidden")) return;
    e.preventDefault();
    var p = stagePoint(e);
    zoomAt(p[0], p[1], e.deltaY < 0 ? 1.2 : 1 / 1.2);
  }

  function onDblClick(e) {
    e.preventDefault();
    var p = stagePoint(e);
    if (scale > 1) fit();
    else zoomAt(p[0], p[1], 2.5);
  }

  function onDown(e) {
    if (e.target !== pic) return;
    e.preventDefault();
    suppressClose = true;
    stage.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, stagePoint(e));
    if (pointers.size === 2) {
      var pts = Array.from(pointers.values());
      pinchDist = Math.hypot(pts[0][0] - pts[1][0], pts[0][1] - pts[1][1]);
    } else if (scale > 1) {
      pic.classList.add("lb-dragging");
    }
  }

  function onMove(e) {
    if (!pointers.has(e.pointerId)) return;
    var p = stagePoint(e);
    if (pointers.size === 2) {                        // pinch zoom
      pointers.set(e.pointerId, p);
      var pts = Array.from(pointers.values());
      var d = Math.hypot(pts[0][0] - pts[1][0], pts[0][1] - pts[1][1]);
      if (pinchDist > 0) {
        zoomAt((pts[0][0] + pts[1][0]) / 2, (pts[0][1] + pts[1][1]) / 2, d / pinchDist);
      }
      pinchDist = d;
    } else if (scale > 1) {                           // drag pan
      var prev = pointers.get(e.pointerId);
      tx += p[0] - prev[0];
      ty += p[1] - prev[1];
      pointers.set(e.pointerId, p);
      clampPan();
      apply();
    }
  }

  function onUp(e) {
    pointers.delete(e.pointerId);
    pinchDist = 0;
    pic.classList.remove("lb-dragging");
  }

  /* ---------- code panel ---------- */
  function toggleCode() {
    if (!codePanel.classList.contains("hidden")) {
      codePanel.classList.add("hidden");
      copyBtn.style.display = "none";
      codeBtn.innerHTML = "&lt;/&gt; view code";
      return;
    }
    var name = basename(pic.src);
    loadMap(function () {
      var entry = (window.__figureCodeMap || {})[name];
      if (entry) {
        codeSrc.textContent = entry.notebook + " · cell " + entry.cell;
        codeBody.textContent = entry.code;
        copyBtn.style.display = "";
      } else {
        codeSrc.textContent = "no source recorded";
        codeBody.textContent = "# No generating code found for this figure.";
        copyBtn.style.display = "none";
      }
      codePanel.classList.remove("hidden");
      codeBtn.innerHTML = "↩ back to image";
    });
  }

  /* ---------- open / close ---------- */
  function open(img) {
    build();
    codePanel.classList.add("hidden");
    copyBtn.style.display = "none";
    codeBtn.innerHTML = "&lt;/&gt; view code";
    suppressClose = false;
    var name = basename(img.currentSrc || img.src);
    codeBtn.style.display = /^figure_.+\.(png|jpe?g|gif|svg)$/i.test(name) ? "" : "none";
    caption.textContent = img.getAttribute("alt") || name;
    pointers.clear();
    pic.style.transform = "";
    pic.src = img.currentSrc || img.src;
    overlay.classList.remove("hidden");
    document.documentElement.style.overflow = "hidden";
    if (pic.complete && pic.naturalWidth) fit();
    else pic.onload = fit;
  }

  function close() {
    overlay.classList.add("hidden");
    document.documentElement.style.overflow = "";
    pic.src = "";
  }

  /* ---------- attach to content images ---------- */
  function attach() {
    document.querySelectorAll("main img").forEach(function (img) {
      if (img.closest("a") || img.closest("nav") || img.closest(".hero")) return;
      if (img.classList.contains("no-zoom")) return;
      img.classList.add("lb-zoomable");
      img.addEventListener("click", function (e) {
        e.preventDefault();
        open(img);
      });
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", attach);
  } else {
    attach();
  }
})();
</script>
